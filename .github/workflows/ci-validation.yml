# .github/workflows/ci-validation.yml

name: CI Validation

on:
  pull_request:
    branches: [ main ]
  
  # Run manually for testing
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest #note: for demo purposes, just use githubs runner. In our actual pipeine we would use a self-hosted EC2 instance.

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install pipenv
          pipenv install --dev

      - name: Lint with black and flake8
        run: |
          pipenv run black --check .
          pipenv run flake8 .

      - name: Test with pytest
        run: |
          pipenv run pytest --cov=image_scraper --cov-fail-under=90